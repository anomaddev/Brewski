<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brewski 1.0 - History</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Menu Bar -->
    <div class="menu-bar">
        <button class="menu-btn" id="menu-btn" onclick="toggleSidebar()">
            <span class="menu-icon">☰</span>
        </button>
        <div class="menu-title">Brewski 1.0</div>
    </div>
    
    <!-- Sidebar Menu -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
        <div class="sidebar-content">
            <button class="sidebar-close" onclick="toggleSidebar()">×</button>
            <nav class="sidebar-nav">
                <a href="/" class="sidebar-item">Dashboard</a>
                <a href="/history" class="sidebar-item">History</a>
                <a href="#" class="sidebar-item" onclick="navigateTo('settings'); return false;">Settings</a>
            </nav>
        </div>
    </div>
    
    <div class="container">
        <div class="history-page">
            <!-- Overview Section -->
            <div class="dashboard-card overview-card">
                <div class="card-title-with-timer">
                    <h2 class="card-title">Overview</h2>
                </div>
                <div class="overview-stats">
                    <div class="overview-stat">
                        <div class="stat-label">Total Runs</div>
                        <div class="stat-value" id="total-runs">0</div>
                    </div>
                    <div class="overview-stat">
                        <div class="stat-label">Average Duration</div>
                        <div class="stat-value" id="avg-duration">0:00</div>
                    </div>
                    <div class="overview-stat">
                        <div class="stat-label">Total Heater 1 Hours</div>
                        <div class="stat-value" id="total-heater1">0.0</div>
                    </div>
                    <div class="overview-stat">
                        <div class="stat-label">Total Heater 2 Hours</div>
                        <div class="stat-value" id="total-heater2">0.0</div>
                    </div>
                </div>
            </div>
            
            <!-- History Table Section -->
            <div class="dashboard-card history-card">
                <div class="card-title-with-timer">
                    <h2 class="card-title">Run History</h2>
                </div>
                <div class="history-table-container">
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Duration</th>
                                <th>Target</th>
                                <th>Heater 1</th>
                                <th>Heater 2</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="history-tbody">
                            <!-- Table rows will be generated by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Generate history data (50 runs)
        function generateHistoryData() {
            const runs = [];
            const now = new Date();
            
            // Generate 50 previous runs with random data
            for (let i = 1; i <= 50; i++) {
                const date = new Date(now);
                date.setDate(date.getDate() - Math.floor(i / 2) - (i % 2 === 0 ? 0 : 1));
                if (i % 2 === 0) {
                    date.setHours(Math.floor(Math.random() * 12) + 12); // Afternoon
                } else {
                    date.setHours(Math.floor(Math.random() * 12)); // Morning
                }
                date.setMinutes(Math.floor(Math.random() * 60));
                
                const durationMinutes = 35 + Math.floor(Math.random() * 30); // 35-65 minutes
                const durationSeconds = Math.floor(Math.random() * 60);
                const duration = `${durationMinutes}:${durationSeconds.toString().padStart(2, '0')}`;
                
                const targets = [160, 165, 170, 162, 168, 175, 163, 167];
                const target = targets[Math.floor(Math.random() * targets.length)];
                
                const statuses = ['Completed', 'Completed', 'Completed', 'Completed', 'Completed', 'Stopped'];
                const status = statuses[Math.floor(Math.random() * statuses.length)];
                
                // Heater run times (in minutes, typically less than or equal to duration)
                const heater1Minutes = status === 'Stopped' 
                    ? Math.floor(durationMinutes * (0.6 + Math.random() * 0.3))
                    : Math.floor(durationMinutes * (0.7 + Math.random() * 0.2));
                const heater2Minutes = status === 'Stopped'
                    ? Math.floor(durationMinutes * (0.5 + Math.random() * 0.3))
                    : Math.floor(durationMinutes * (0.6 + Math.random() * 0.25));
                
                runs.push({
                    date: date,
                    duration: duration,
                    durationMinutes: durationMinutes,
                    target: target,
                    heater1Minutes: heater1Minutes,
                    heater2Minutes: heater2Minutes,
                    status: status
                });
            }
            
            // Sort by date, most recent first
            runs.sort((a, b) => b.date - a.date);
            
            return runs;
        }
        
        // Calculate statistics
        function calculateStatistics(runs) {
            const totalRuns = runs.length;
            const completedRuns = runs.filter(r => r.status === 'Completed');
            const avgDuration = completedRuns.length > 0
                ? completedRuns.reduce((sum, r) => sum + r.durationMinutes, 0) / completedRuns.length
                : 0;
            
            const totalHeater1Hours = runs.reduce((sum, r) => sum + r.heater1Minutes, 0) / 60;
            const totalHeater2Hours = runs.reduce((sum, r) => sum + r.heater2Minutes, 0) / 60;
            
            return {
                totalRuns,
                avgDuration,
                totalHeater1Hours,
                totalHeater2Hours
            };
        }
        
        // Format duration in minutes to HH:MM
        function formatDuration(minutes) {
            const hrs = Math.floor(minutes / 60);
            const mins = Math.floor(minutes % 60);
            return `${hrs}:${mins.toString().padStart(2, '0')}`;
        }
        
        // Render history table
        function renderHistory() {
            const runs = generateHistoryData();
            const stats = calculateStatistics(runs);
            const tbody = document.getElementById('history-tbody');
            
            // Update overview statistics
            document.getElementById('total-runs').textContent = stats.totalRuns;
            document.getElementById('avg-duration').textContent = formatDuration(stats.avgDuration);
            document.getElementById('total-heater1').textContent = stats.totalHeater1Hours.toFixed(1);
            document.getElementById('total-heater2').textContent = stats.totalHeater2Hours.toFixed(1);
            
            // Render table
            tbody.innerHTML = runs.map(run => {
                const dateStr = run.date.toLocaleDateString('en-US', { 
                    month: 'short', 
                    day: 'numeric',
                    year: 'numeric'
                });
                const timeStr = run.date.toLocaleTimeString('en-US', { 
                    hour: 'numeric', 
                    minute: '2-digit',
                    hour12: true
                });
                
                const statusClass = run.status === 'Completed' ? 'status-completed' : 'status-stopped';
                const heater1Time = formatDuration(run.heater1Minutes);
                const heater2Time = formatDuration(run.heater2Minutes);
                
                return `
                    <tr>
                        <td>${dateStr}<br><span class="time-text">${timeStr}</span></td>
                        <td>${run.duration}</td>
                        <td>${run.target}°F</td>
                        <td>${heater1Time}</td>
                        <td>${heater2Time}</td>
                        <td><span class="status-badge ${statusClass}">${run.status}</span></td>
                    </tr>
                `;
            }).join('');
        }
        
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('active');
        }
        
        function navigateTo(page) {
            console.log('Navigate to:', page);
            toggleSidebar();
            if (page === 'dashboard') {
                window.location.href = '/';
            } else if (page === 'history') {
                window.location.href = '/history';
            }
        }
        
        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            renderHistory();
        });
    </script>
</body>
</html>
