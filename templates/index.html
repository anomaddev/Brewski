<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brewski 1.0 - Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <!-- Menu Bar -->
    <div class="menu-bar">
        <button class="menu-btn" id="menu-btn" onclick="toggleSidebar()">
            <span class="menu-icon">☰</span>
        </button>
        <div class="menu-title">Brewski 1.0</div>
    </div>
    
    <!-- Sidebar Menu -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
        <div class="sidebar-content">
            <button class="sidebar-close" onclick="toggleSidebar()">×</button>
            <nav class="sidebar-nav">
                <a href="/" class="sidebar-item">Dashboard</a>
                <a href="/history" class="sidebar-item">History</a>
                <a href="#" class="sidebar-item" onclick="navigateTo('settings'); return false;">Settings</a>
            </nav>
        </div>
    </div>
    
    <div class="container">
        <div class="dashboard-grid">
            <!-- Left Column: System Status and Current Temps -->
            <div class="dashboard-column">
                <!-- System Status Section -->
                <div class="dashboard-card system-status-card">
                    <div class="card-title-with-timer">
                        <h2 class="card-title">System Status</h2>
                        <div class="timer-display" id="system-timer">45:00</div>
                    </div>
                    <div class="status-details">
                        <div class="status-item">
                            <span class="status-label">System Status:</span>
                            <span class="status-value running">Running</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">Heater 1:</span>
                            <span class="status-value">
                                <span class="status-indicator indicator-on"></span>
                                On
                            </span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">Heater 2:</span>
                            <span class="status-value">
                                <span class="status-indicator indicator-on"></span>
                                On
                            </span>
                        </div>
                    </div>
                    <div class="status-actions">
                        <button class="action-btn pause-btn" onclick="handlePause()">Pause</button>
                        <button class="action-btn stop-btn" onclick="handleStop()">Stop</button>
                    </div>
                </div>
                
                <!-- Current Temps Section -->
                <div class="dashboard-card current-temps-card">
                    <div class="card-title-with-timer">
                        <h2 class="card-title">Current Temps</h2>
                        <button class="view-all-btn" onclick="handleSetTarget()">Set Target</button>
                    </div>
                    <div class="status-details">
                        <div class="status-item">
                            <span class="status-label">Target Temp:</span>
                            <span class="status-value">165°F</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">Current Temp:</span>
                            <span class="status-value">134°F</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">Internal Temp:</span>
                            <span class="status-value">86°F</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Right Column: Chart and Previous Runs -->
            <div class="dashboard-column">
                <!-- Temperature Chart Section -->
                <div class="dashboard-card chart-card">
                    <div class="card-title-with-timer">
                        <h2 class="card-title">Temperature Over Time</h2>
                    </div>
                    <div class="chart-container">
                        <canvas id="temperatureChart"></canvas>
                    </div>
                </div>
                
                <!-- Previous Runs Section -->
                <div class="dashboard-card previous-runs-card">
                    <div class="card-title-with-timer">
                        <h2 class="card-title">Previous Runs</h2>
                        <a href="/history" class="view-all-btn">View All</a>
                    </div>
                    <div class="runs-table-container">
                        <table class="runs-table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Duration</th>
                                    <th>Target</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="previous-runs-tbody">
                                <!-- Table rows will be generated by JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Temperature Keypad Modal -->
    <div class="modal-overlay" id="temperature-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Set Target Temperature</h2>
                <button class="modal-close" onclick="closeTemperatureModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="temperature-display" id="modal-temperature-display"></div>
                <div class="keypad">
                    <button class="keypad-btn" onclick="appendDigit(1)">1</button>
                    <button class="keypad-btn" onclick="appendDigit(2)">2</button>
                    <button class="keypad-btn" onclick="appendDigit(3)">3</button>
                    <button class="keypad-btn" onclick="appendDigit(4)">4</button>
                    <button class="keypad-btn" onclick="appendDigit(5)">5</button>
                    <button class="keypad-btn" onclick="appendDigit(6)">6</button>
                    <button class="keypad-btn" onclick="appendDigit(7)">7</button>
                    <button class="keypad-btn" onclick="appendDigit(8)">8</button>
                    <button class="keypad-btn" onclick="appendDigit(9)">9</button>
                    <button class="keypad-btn clear-btn" onclick="clearTemperature()">Clear</button>
                    <button class="keypad-btn" onclick="appendDigit(0)">0</button>
                    <button class="keypad-btn" onclick="backspaceTemperature()">⌫</button>
                </div>
                <div class="modal-actions">
                    <button class="action-btn cancel-btn" onclick="closeTemperatureModal()">Cancel</button>
                    <button class="action-btn submit-btn" onclick="submitTemperature()">Submit</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Generate polynomial temperature data (2 hours, 40F to 165F)
        function generateTemperatureData() {
            const dataPoints = 120; // 120 minutes = 2 hours
            const startTemp = 40;
            const endTemp = 165;
            const tempRange = endTemp - startTemp;
            const labels = [];
            const temperatures = [];
            
            // Create polynomial curve (quadratic for smooth heating curve)
            for (let i = 0; i <= dataPoints; i++) {
                const t = i / dataPoints; // Normalized time (0 to 1)
                // Polynomial: t^2 creates a smooth curve that accelerates then levels
                const temp = startTemp + tempRange * (t * t);
                labels.push(formatTime(i));
                temperatures.push(Math.round(temp * 10) / 10);
            }
            
            return { labels, temperatures };
        }
        
        function formatTime(minutes) {
            const hours = Math.floor(minutes / 60);
            const mins = minutes % 60;
            return `${hours}:${mins.toString().padStart(2, '0')}`;
        }
        
        // Format duration in seconds to HH:MM:SS
        function formatDurationHMS(totalSeconds) {
            const hrs = Math.floor(totalSeconds / 3600);
            const mins = Math.floor((totalSeconds % 3600) / 60);
            const secs = totalSeconds % 60;
            return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Chart instance (stored globally to allow updates)
        let temperatureChart = null;
        
        // Get target temperature from dashboard
        function getTargetTemperature() {
            const targetTempElement = document.querySelector('.current-temps-card .status-item:first-child .status-value');
            if (targetTempElement) {
                const tempText = targetTempElement.textContent;
                // Extract number from "165°F" format
                const match = tempText.match(/(\d+(?:\.\d+)?)/);
                return match ? parseFloat(match[1]) : 165;
            }
            return 165; // Default fallback
        }
        
        // Initialize temperature chart
        function initTemperatureChart() {
            const { labels, temperatures } = generateTemperatureData();
            const targetTemp = getTargetTemperature();
            const ctx = document.getElementById('temperatureChart').getContext('2d');
            
            // Create target temperature line data (horizontal line at target temp)
            const targetLineData = labels.map(() => targetTemp);
            
            temperatureChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Temperature (°F)',
                        data: temperatures,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4, // Smooth curve
                        pointRadius: 0, // Hide points for cleaner look
                        pointHoverRadius: 4
                    }, {
                        label: 'Target Temperature',
                        data: targetLineData,
                        borderColor: '#10b981',
                        backgroundColor: 'transparent',
                        borderWidth: 2,
                        borderDash: [5, 5], // Dashed line
                        fill: false,
                        pointRadius: 0,
                        pointHoverRadius: 0,
                        tension: 0 // Straight line
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            min: 30,
                            max: 180,
                            title: {
                                display: true,
                                text: 'Temperature (°F)'
                            },
                            grid: {
                                color: 'rgba(0, 0, 0, 0.05)'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Time (Hours:Minutes)'
                            },
                            grid: {
                                display: false
                            }
                        }
                    },
                    interaction: {
                        mode: 'nearest',
                        axis: 'x',
                        intersect: false
                    }
                }
            });
        }
        
        function handlePause() {
            console.log('Pause button clicked');
            // TODO: Implement pause functionality
        }
        
        function handleStop() {
            console.log('Stop button clicked');
            // TODO: Implement stop functionality
        }
        
        // Temperature modal state
        let currentTemperature = '';
        
        function handleSetTarget() {
            currentTemperature = '';
            updateTemperatureDisplay();
            openTemperatureModal();
        }
        
        function openTemperatureModal() {
            const modal = document.getElementById('temperature-modal');
            modal.classList.add('active');
            // Prevent body scroll when modal is open
            document.body.style.overflow = 'hidden';
        }
        
        function closeTemperatureModal() {
            const modal = document.getElementById('temperature-modal');
            modal.classList.remove('active');
            // Restore body scroll
            document.body.style.overflow = '';
            // Reset temperature
            currentTemperature = '';
            updateTemperatureDisplay();
        }
        
        function appendDigit(digit) {
            // Limit to 3 digits (max 200°F)
            if (currentTemperature.length < 3) {
                currentTemperature += digit.toString();
                updateTemperatureDisplay();
            }
        }
        
        function clearTemperature() {
            currentTemperature = '';
            updateTemperatureDisplay();
        }
        
        function backspaceTemperature() {
            if (currentTemperature.length > 0) {
                currentTemperature = currentTemperature.slice(0, -1);
                updateTemperatureDisplay();
            }
        }
        
        function updateTemperatureDisplay() {
            const display = document.getElementById('modal-temperature-display');
            if (currentTemperature === '') {
                display.textContent = '';
            } else {
                display.textContent = currentTemperature + '°F';
            }
        }
        
        function submitTemperature() {
            if (currentTemperature === '') {
                alert('Please enter a temperature');
                return;
            }
            
            const temp = parseFloat(currentTemperature);
            
            // Validate range (40-200°F)
            if (isNaN(temp) || temp < 40 || temp > 200) {
                alert('Temperature must be between 40°F and 200°F');
                return;
            }
            
            // Submit to server
            fetch('/submit_temperature', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ temperature: temp })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    // Update the target temp display on the dashboard
                    const targetTempElement = document.querySelector('.current-temps-card .status-item:first-child .status-value');
                    if (targetTempElement) {
                        targetTempElement.textContent = temp + '°F';
                    }
                    // Update the target temperature line on the chart
                    updateChartTargetLine(temp);
                    closeTemperatureModal();
                } else {
                    alert(data.message || 'Error submitting temperature');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error submitting temperature. Please try again.');
            });
        }
        
        // Update chart target temperature line
        function updateChartTargetLine(targetTemp) {
            if (temperatureChart) {
                const { labels } = generateTemperatureData();
                const targetLineData = labels.map(() => targetTemp);
                temperatureChart.data.datasets[1].data = targetLineData;
                temperatureChart.update();
            }
        }
        
        // Close modal when clicking outside
        document.addEventListener('click', function(event) {
            const modal = document.getElementById('temperature-modal');
            if (event.target === modal) {
                closeTemperatureModal();
            }
        });
        
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('active');
        }
        
        function navigateTo(page) {
            console.log('Navigate to:', page);
            toggleSidebar();
            if (page === 'dashboard') {
                window.location.href = '/';
            } else if (page === 'history') {
                window.location.href = '/history';
            }
        }
        
        // Initialize system timer (counting up from 45 minutes)
        function initSystemTimer() {
            let totalSeconds = 45 * 60; // Start at 45 minutes
            
            function updateTimer() {
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;
                const timerDisplay = document.getElementById('system-timer');
                if (timerDisplay) {
                    timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                }
                totalSeconds++;
            }
            
            // Update immediately
            updateTimer();
            
            // Update every second
            setInterval(updateTimer, 1000);
        }
        
        // Generate previous runs data
        function generatePreviousRuns() {
            const runs = [];
            const now = new Date();
            
            // Generate 10 previous runs with random data
            for (let i = 1; i <= 10; i++) {
                const date = new Date(now);
                date.setDate(date.getDate() - i);
                date.setHours(Math.floor(Math.random() * 24));
                date.setMinutes(Math.floor(Math.random() * 60));
                
                // Generate random durations in seconds (35-65 minutes range)
                const durationMinutes = 35 + Math.floor(Math.random() * 30);
                const durationSeconds = Math.floor(Math.random() * 60);
                const durationTotalSeconds = durationMinutes * 60 + durationSeconds;
                const duration = formatDurationHMS(durationTotalSeconds);
                
                const targets = [165, 170, 160, 175, 165, 168, 162, 172, 165, 167];
                const statuses = ['Completed', 'Completed', 'Completed', 'Completed', 'Completed', 'Completed', 'Stopped', 'Completed', 'Completed', 'Completed'];
                
                runs.push({
                    date: date,
                    duration: duration,
                    target: targets[i - 1],
                    status: statuses[i - 1]
                });
            }
            
            return runs;
        }
        
        // Render previous runs table
        function renderPreviousRuns() {
            const runs = generatePreviousRuns();
            const tbody = document.getElementById('previous-runs-tbody');
            
            tbody.innerHTML = runs.map(run => {
                const dateStr = run.date.toLocaleDateString('en-US', { 
                    month: 'short', 
                    day: 'numeric',
                    year: 'numeric'
                });
                const timeStr = run.date.toLocaleTimeString('en-US', { 
                    hour: 'numeric', 
                    minute: '2-digit',
                    hour12: true
                });
                
                const statusClass = run.status === 'Completed' ? 'status-completed' : 'status-stopped';
                
                return `
                    <tr>
                        <td>${dateStr}<br><span class="time-text">${timeStr}</span></td>
                        <td>${run.duration}</td>
                        <td>${run.target}°F</td>
                        <td><span class="status-badge ${statusClass}">${run.status}</span></td>
                    </tr>
                `;
            }).join('');
        }
        
        // Initialize chart when page loads
        document.addEventListener('DOMContentLoaded', function() {
            initTemperatureChart();
            initSystemTimer();
            renderPreviousRuns();
        });
    </script>
</body>
</html>
